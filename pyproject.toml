[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "printprep"
version = "0.1.0"
description = "3D print model analysis and slicer recommendation tool"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Ömer Özgen", email = "90107212+omerozgen@users.noreply.github.com"}
]
keywords = ["3d-printing", "stl", "slicer", "mesh-analysis", "creality", "anycubic"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Computer-Aided Design",
]

dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "trimesh>=4.0.0",
    "networkx>=3.0.0",
    "rtree>=1.0.0",
    "click>=8.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "httpx>=0.27.0",
]
web = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
]
merge = [
    "manifold3d>=2.3.0",
]
repair = [
    "pymeshfix>=0.16.0",
]
analyze = [
    # Used for self-intersection face detection (Python 3.10+ only — no wheel for 3.9).
    "pymeshlab>=2023.12; python_version >= '3.10'",
]
desktop = [
    # `printprep app` opens the web UI inside a native window
    # (WKWebView on macOS, WebView2 on Windows, GTK WebKit on Linux).
    "pywebview>=5.0",
]

[project.scripts]
printprep = "printprep.cli:main"

[project.urls]
Homepage = "https://github.com/omerozgen/printprep"
Repository = "https://github.com/omerozgen/printprep.git"

[tool.setuptools.packages.find]
where = ["."]
include = ["printprep*"]

[tool.setuptools.package-data]
printprep = [
    "config/*.json",
    "locales/*.json",
    "web/static/*",
    "web/static/**/*",
    "web/static/vendor/*",
    "web/static/vendor/addons/*",
    "web/static/locales/*.json",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
